<!DOCTYPE html>
<html lang="ko" 
	xmlns:th="http://www.thymeleaf.org" 
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
	<section layout:fragment="contents" class="contents d-flex justify-content-center">
		<div class="user-box memo-bg my-5 p-5 rounded-lg"> <!-- 일단 부트스트랩으로 사이즈 라운드 조절함 -->
			<h1 class="text-center">로그인</h1>
			<input type="text" class="form-control mt-4" placeholder="아이디" id="idInput">
			<input type="password" class="form-control mt-2" placeholder="비밀번호" id="passwordInput">
			<button type="button" class="btn btn-secondary btn-block mt-3" id="loginBtn">로그인</button>	
			<div class="text-center mt-4"></div>회원가입<a href="/user/join-view"></a>
		</div>
	</section>
	
	<script layout:fragment="script">
		$("#loginBtn").on("click", function(){
			let id = $("#idInput").val();
			let password = $("#passwordInput").val();
			if(id == "") {
				alert("아이디를 입력하세요");
				return;
			}
			if(password==""){
				alert("비밀번호를 입력하세요");
				return;
			}
			
			
			$.ajax({
				type:"post"
				, url:"/user/login"
				, data:{"loginId":id, "password":password}
				, success:function(response){
					if(response.result == "success"){
						// 로그인 성공했을 때 메모리스트 페이지로 이동시키게 하면 된다
						// 만들어둔거 없어도 그냥 링크만 넣자
						location.href = "/post/list-view";
					} else {
						alert("아이디, 비밀번호를 확인해 주세요.");
					}
					
					
				}
				, error:function() {
					alert("로그인 에러!");
				}
			})
			
			
		})
	
	
	</script>
	
	
</html>
